name: Fetch free giving photos
on:
  push:
    branches: [claude/project-thread-a3ka0z]
    paths: [tools/photos/giving.txt, .github/workflows/fetch-giving.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos from Unsplash (free licence)
        run: |
          mkdir -p design/mobile-app/photos/giving
          while read n id; do
            [ -z "$n" ] && continue
            curl -sSfL "https://images.unsplash.com/${id}?fm=jpg&q=80&w=1400" -o "design/mobile-app/photos/giving/${n}.jpg" && echo "$n ok" || echo "$n FAILED"
          done < tools/photos/giving.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add design/mobile-app/photos/giving
          git commit -m "Add free Unsplash giving photos" || exit 0
          git push
